<!DOCTYPE html>
<html lang="en" data-theme="NaHida_Light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaHida 🌿 Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- Librerie per il Live2D -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
</head>

<body>
    <!-- Theme Toggle -->
    <div class="absolute top-4 right-4 z-50">
        <label class="swap swap-rotate text-base-content hover:opacity-70 transition-opacity">
            <input type="checkbox" class="theme-controller" value="NaHida_Dark" />

            <!-- sun icon -->
            <svg
                class="swap-off h-6 w-6 fill-current"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">
                <path
                    d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
            </svg>

            <!-- moon icon -->
            <svg
                class="swap-on h-6 w-6 fill-current"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">
                <path
                    d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
            </svg>
        </label>
    </div>

    <div class="hero bg-base-200 min-h-screen">
        <div class="hero-content flex-col lg:flex-row">
            <!-- Contenitore del modello! -->
            <div class="w-64 h-64 mb-[-2rem] z-10 relative">

                <!-- Skeleton di caricamento -->
                <div id="model-skeleton" class="skeleton w-full h-full rounded-box absolute inset-0 z-20"></div>

                <canvas id="live2d-canvas"
                    class="w-full h-full pointer-events-auto opacity-0 transition-opacity duration-700 absolute inset-0 z-30"></canvas>

            </div>
            <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4 relative z-20">
                <legend class="fieldset-legend">Accedi a NaHida</legend>

                <label class="label">Email</label>
                <input type="email" class="input" placeholder="Email" />

                <label class="label">Password</label>
                <input type="password" class="input" placeholder="Password" onfocus="PlantViewer.setPasswordMode(true)"
                    onblur="PlantViewer.setPasswordMode(false)" />

                <button class="btn btn-neutral mt-4">Accedi</button>
            </fieldset>
        </div>
    </div>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="./js/live2d-viewer.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            PlantViewer.init('live2d-canvas');
            PlantViewer.randomizeAppearance();
        });
    </script>

    <style>
        /* Imposto il font su tutto il body! */
        body {
            font-family: 'Balsamiq Sans', sans-serif;
        }

        /* 1. Tema di Base (Fallback/Default = Light) */
        :root {
            color-scheme: light;
            --color-base-100: #F5F0E8;
            --color-base-200: #EAE2D5;
            --color-base-300: #DDD3C0;
            --color-base-content: #1A1410;
            --color-primary: #5A7A3A;
            --color-primary-content: #F0F7E8;
            --color-secondary: #C4703A;
            --color-secondary-content: #FEF3EC;
            --color-accent: #9EBB5C;
            --color-accent-content: #2A3A14;
            --color-neutral: #4A3728;
            --color-neutral-content: #F5F0E8;
            --color-info: #3A7A8A;
            --color-info-content: #E8F5F7;
            --color-success: #4A8A4A;
            --color-success-content: #E8F5E8;
            --color-warning: #C4903A;
            --color-warning-content: #FEF6E8;
            --color-error: #B04040;
            --color-error-content: #FEF0F0;
            --radius-selector: 1rem;
            --radius-field: 1rem;
            --radius-box: 1rem;
            --size-selector: 0.3125rem;
            --size-field: 0.3125rem;
            --border: 2px;
            --depth: 0;
            --noise: 1;
        }

        /* 2. Tema NaHida_Dark (Prefers Dark) */
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --color-base-100: #1C1810;
                --color-base-200: #261F14;
                --color-base-300: #32281A;
                --color-base-content: #E8DFD0;
                --color-primary: #7AAA4A;
                --color-primary-content: #0E1A08;
                --color-secondary: #E0935A;
                --color-secondary-content: #1E0A00;
                --color-accent: #C4DC88;
                --color-accent-content: #1A2A04;
                --color-neutral: #C8B89A;
                --color-neutral-content: #1C1810;
                --color-info: #5AAABB;
                --color-info-content: #041418;
                --color-success: #6ABB6A;
                --color-success-content: #041804;
                --color-warning: #E0B06A;
                --color-warning-content: #1E0E00;
                --color-error: #D46A6A;
                --color-error-content: #1E0404;
                --radius-selector: 1rem;
                --radius-field: 1rem;
                --radius-box: 1rem;
                --size-selector: 0.3125rem;
                --size-field: 0.3125rem;
                --border: 2px;
                --depth: 0;
                --noise: 1;
            }
        }

        /* 3. Forzature manuali messe ALLA FINE così sovrascrivono la media query! */

        /* Forza Light */
        :root:has(input.theme-controller[value="NaHida_Light"]:checked),
        [data-theme="NaHida_Light"] {
            color-scheme: light;
            --color-base-100: #F5F0E8;
            --color-base-200: #EAE2D5;
            --color-base-300: #DDD3C0;
            --color-base-content: #1A1410;
            --color-primary: #5A7A3A;
            --color-primary-content: #F0F7E8;
            --color-secondary: #C4703A;
            --color-secondary-content: #FEF3EC;
            --color-accent: #9EBB5C;
            --color-accent-content: #2A3A14;
            --color-neutral: #4A3728;
            --color-neutral-content: #F5F0E8;
            --color-info: #3A7A8A;
            --color-info-content: #E8F5F7;
            --color-success: #4A8A4A;
            --color-success-content: #E8F5E8;
            --color-warning: #C4903A;
            --color-warning-content: #FEF6E8;
            --color-error: #B04040;
            --color-error-content: #FEF0F0;
        }

        /* Forza Dark */
        :root:has(input.theme-controller[value="NaHida_Dark"]:checked),
        [data-theme="NaHida_Dark"] {
            color-scheme: dark;
            --color-base-100: #1C1810;
            --color-base-200: #261F14;
            --color-base-300: #32281A;
            --color-base-content: #E8DFD0;
            --color-primary: #7AAA4A;
            --color-primary-content: #0E1A08;
            --color-secondary: #E0935A;
            --color-secondary-content: #1E0A00;
            --color-accent: #C4DC88;
            --color-accent-content: #1A2A04;
            --color-neutral: #C8B89A;
            --color-neutral-content: #1C1810;
            --color-info: #5AAABB;
            --color-info-content: #041418;
            --color-success: #6ABB6A;
            --color-success-content: #041804;
            --color-warning: #E0B06A;
            --color-warning-content: #1E0E00;
            --color-error: #D46A6A;
            --color-error-content: #1E0404;
        }
    </style>
</body>

</html>
